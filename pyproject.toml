[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "type-as-you-speak"
version = "0.5.3"
description = "Privacy-first real-time dictation for focused desktop apps, with strict offline Linux integration."
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL.md"]
authors = [{ name = "Faizal Sahebdin", email = "faizal.sahebdin@gmail.com" }]
keywords = ["dictation", "speech-to-text", "whisper", "wayland", "x11", "linux", "asr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "faster-whisper>=1.2.1,<2",
  "numpy>=2.3,<3",
  "onnxruntime>=1.26,<2",
]

[project.optional-dependencies]
# Only needed if you want to generate synthetic speech for testing without a mic.
dev = ["gTTS>=2.5.4,<3"]
# Needed for the settings window (`tays gui`). Kept optional so the core — and
# the CPU-only store builds — stay lean; `tays gui` degrades with a hint if absent.
gui = ["PySide6-Essentials>=6.12,<7", "tomlkit>=0.15.3,<1"]

[project.urls]
Homepage = "https://github.com/iller7/type-as-you-speak"
Issues = "https://github.com/iller7/type-as-you-speak/issues"

[project.scripts]
tays = "type_as_you_speak.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "build==1.6.1",
  "pip-audit==2.10.1",
  "pytest==9.2.0",
  "ruff==0.17.6",
  "setuptools==84.2.1",
  "twine==7.0.0",
  "wheel>=0.45.1",
  "zizmor==1.33.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not recognition'"
markers = ["recognition: real pinned-model CPU inference; explicit model preparation required"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
