<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- type-as-you-speak — ACTIVE (dictation session live). Red mic. -->
  <!-- stand: leg + base -->
  <g fill="#9E3B3B">
    <rect x="247" y="370" width="18" height="45"/>
    <rect x="183" y="398" width="146" height="18" rx="9"/>
  </g>
  <!-- capsule body (coral red) -->
  <path d="M201 135 A55 55 0 0 1 311 135 L311 290 A55 55 0 0 1 201 290 Z" fill="#E2574C"/>
  <!-- capsule top (lighter red, down to the band) -->
  <path d="M201 135 A55 55 0 0 1 311 135 L311 205 L201 205 Z" fill="#F2938A"/>
  <!-- capsule outline -->
  <path d="M201 135 A55 55 0 0 1 311 135 L311 290 A55 55 0 0 1 201 290 Z"
        fill="none" stroke="#9E3B3B" stroke-width="18"/>
  <!-- band (extends past the capsule sides) -->
  <rect x="179" y="205" width="154" height="30" rx="15" fill="#EF7D72"/>
  <!-- holder: clean U, round tips -->
  <path d="M164 240 A92 135 0 0 0 348 240"
        fill="none" stroke="#9E3B3B" stroke-width="18" stroke-linecap="round"/>
</svg>
