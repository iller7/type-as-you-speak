name: Bug report
description: Report a reproducible problem without sharing private dictation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real dictation, audio, hotword lists, credentials or personal file contents. Use a synthetic example.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distro/version, desktop, Wayland or X11, install method, tays version, Python version, CPU/GPU and model.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitised diagnostics
      description: Check logs for private content before sharing, especially logs from older releases.
