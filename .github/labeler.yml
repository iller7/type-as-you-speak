bug:
  - head-branch: ["^fix/"]
enhancement:
  - head-branch: ["^feat/"]
documentation:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
area:ci:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", ".github/dependabot.yml"]
area:packaging:
  - changed-files:
      - any-glob-to-any-file:
          ["packaging/**", "pyproject.toml", "uv.lock", "install.sh"]
area:testing:
  - changed-files:
      - any-glob-to-any-file:
          ["tests/**", "scripts/check-*", "scripts/recognition.py"]
area:security:
  - changed-files:
      - any-glob-to-any-file:
          [
            "SECURITY.md",
            "src/type_as_you_speak/privacy.py",
            "src/type_as_you_speak/offline.py",
            "scripts/*audit*",
          ]
area:ui:
  - changed-files:
      - any-glob-to-any-file: ["src/type_as_you_speak/gui.py", "applet/**"]
area:community:
  - changed-files:
      - any-glob-to-any-file:
          [
            "CODE_OF_CONDUCT.md",
            "SUPPORT.md",
            "CONTRIBUTING.md",
            ".github/ISSUE_TEMPLATE/**",
            ".github/labeler.yml",
          ]
area:web:
  - changed-files:
      - any-glob-to-any-file:
          ["docs/assets/**", "docs/_layouts/**", "docs/index.md"]
area:licensing:
  - changed-files:
      - any-glob-to-any-file:
          [
            "LICENSE",
            "LICENSES/**",
            "NOTICE",
            "COMMERCIAL.md",
            "docs/licensing.md",
          ]
