name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository] -- actionlint requires the documented relative syntax
  packages:
    uses: ./.github/workflows/packages.yml # zizmor: ignore[self-repository] -- actionlint requires the documented relative syntax

  passed:
    if: always()
    needs: [checks, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require code and native package checks
        env:
          CHECKS: ${{ needs.checks.result }}
          PACKAGES: ${{ needs.packages.result }}
        run: test "$CHECKS" = success && test "$PACKAGES" = success
