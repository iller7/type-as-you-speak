name: packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deb:
    name: deb (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu24.04
            image: ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b
          - distro: ubuntu26.04
            image: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
          - distro: debian12
            image: debian:12-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
          - distro: debian13
            image: debian:13-slim@sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, audit and install native package
        env:
          BASE_IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
        run: docker build --build-arg "BASE_IMAGE=$BASE_IMAGE" -f packaging/containers/debian.Dockerfile --output "type=local,dest=dist/packages/$DISTRO" .
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.distro }}
          path: |
            dist/packages/${{ matrix.distro }}/*.deb
            dist/packages/${{ matrix.distro }}/*.cdx.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  rpm:
    name: rpm (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora44
            version: "44"
            image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
          - distro: fedora45
            version: "45"
            image: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, audit and install native RPM
        env:
          BASE_IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
          EXPECTED_FEDORA: ${{ matrix.version }}
        run: |
          build_args=(--build-arg "EXPECTED_FEDORA=$EXPECTED_FEDORA")
          if [ -n "$BASE_IMAGE" ]; then
            build_args+=(--build-arg "BASE_IMAGE=$BASE_IMAGE")
          fi
          docker build "${build_args[@]}" -f packaging/containers/fedora.Dockerfile --output "type=local,dest=dist/packages/$DISTRO" .
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.distro }}
          path: |
            dist/packages/${{ matrix.distro }}/*.rpm
            dist/packages/${{ matrix.distro }}/*.cdx.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Arch package from this checkout
        run: docker build -f packaging/containers/arch.Dockerfile .
