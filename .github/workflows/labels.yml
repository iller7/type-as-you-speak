name: labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to label
        required: true
        type: string

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Metadata only: never check out or execute code from the pull request.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
